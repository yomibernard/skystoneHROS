name: Deploy to HostGator

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

concurrency:
  group: hostgator-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ github.ref_name == 'main' && 'Production' || 'Staging' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the hosting settings
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=
          [ -n "$FTP_SERVER" ] || missing="$missing FTP_SERVER"
          [ -n "$FTP_USERNAME" ] || missing="$missing FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "This environment is missing:$missing"
            echo "Open Settings, Environments, then this environment, and add them before re-running."
            exit 1
          fi

      - name: Publish the site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ vars.FTP_PORT }}
          protocol: ${{ vars.FTP_PROTOCOL }}
          server-dir: ${{ vars.FTP_SERVER_DIR }}
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/data/**
            **/tests/**
            **/docs/**
            **/*.md
            **/package.json
            **/server.js
            **/LICENSE
            **/SECURITY.md
            **/CHANGELOG.md
